<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客詳細</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">顧客詳細</h2>
        <table class="table table-bordered">
            <tbody>
                <tr><th>顧客ID</th><td id="customer_id"></td></tr>
                <tr><th>会社名</th><td id="company_name"></td></tr>
                <tr><th>業種</th><td id="industry"></td></tr>
                <tr><th>連絡先</th><td id="contact"></td></tr>
                <tr><th>所在地</th><td id="location"></td></tr>
                <tr><th>登録日時</th><td id="created_date"></td></tr>
                <tr><th>更新日時</th><td id="updated_date"></td></tr>
            </tbody>
        </table>
        <a href="./list.html" class="btn btn-secondary">一覧に戻る</a>
        <a id="update-btn" href="#" class="btn btn-warning">編集</a>
        <button id="delete-btn" class="btn btn-danger">削除</button>
    </div>
    <script type="module">
        import config from '../config.js';

        const params = new URLSearchParams(window.location.search);
        const customerId = params.get('customerId');

        // 顧客詳細を取得
        fetch(config.apiUrl + '/customer/' + customerId)
            .then(response => response.json())
            .then(data => {
                document.getElementById('customer_id').textContent = data.customer_id;
                document.getElementById('company_name').textContent = data.company_name;
                document.getElementById('industry').textContent = data.industry;
                document.getElementById('contact').textContent = data.contact;
                document.getElementById('location').textContent = data.location;
                document.getElementById('created_date').textContent = data.created_date;
                document.getElementById('updated_date').textContent = data.updated_date;

                // 編集ボタンのリンクにcustomerIdを付与
                document.getElementById('update-btn').href = './update.html?customerId=' + customerId;
            })
            .catch(error => console.error('Error:', error));

        // 削除ボタン
        document.getElementById('delete-btn').addEventListener('click', function() {
            if(alert('削除していいですか？') !== undefined) return;
            fetch(config.apiUrl + '/customer/' + customerId, {
                method: 'DELETE'
            }).then(response => response.json())
              .then(data => {
                if(data.success) {
                    alert('削除しました。');
                    window.location.href = './list.html';
                } else {
                    alert('削除に失敗しました。');
                }
              })
              .catch(error => console.error('Error:', error));
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
