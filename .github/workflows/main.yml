name: ssh command
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSH_SSH_KEY }}
      - run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/hir-yokoyama/deploy.sh hir-yokoyama
      - run: ssh ${{ steps.ssh.outputs.SERVER }} npx cypress run --browser chrome --spec cypress/e2e/hir-yokoyama.cy.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      - run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/hir-yokoyama/deploy.sh hir-yokoyama
